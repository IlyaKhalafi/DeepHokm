[project]
name = "deephokm"
version = "0.1.0"
description = "Reinforcement learning for Hokm, the Persian trick-taking card game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DeepHokm" }]
dependencies = [
    "fastapi>=0.141.1",
    "gymnasium>=1.3.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "sb3-contrib>=2.9.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[project.urls]
Homepage = "https://github.com/ilya-g/deephokm"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/deephokm"]

[tool.hatch.build.targets.wheel.force-include]
"src/deephokm/py.typed" = "deephokm/py.typed"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PL",  # pylint
]
ignore = [
    "PLR0913", # many arguments are fine for config-style constructors
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"] # magic numbers are expected in assertions

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sb3_contrib.*", "stable_baselines3.*", "tensorboard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deephokm --cov-report=term-missing --cov-branch -q"
filterwarnings = [
    "ignore::DeprecationWarning:gymnasium.*",
]

[tool.coverage.run]
source = ["src/deephokm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
